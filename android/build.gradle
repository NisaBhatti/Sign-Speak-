import 'dart:typed_data';
import 'package:flutter/services.dart';

class HandDetectionService {
  static const MethodChannel _channel = MethodChannel('hand_detection');
  
  // Process image and get prediction
  static Future<DetectionResult> processImage(Uint8List imageBytes) async {
    try {
      final result = await _channel.invokeMethod('processFrame', {
        'imageBytes': imageBytes,
      });
      
      if (result != null) {
        return DetectionResult.fromMap(result as Map<dynamic, dynamic>);
      }
    } on PlatformException catch (e) {
      print('Failed to process image: ${e.message}');
    } catch (e) {
      print('Error: $e');
    }
    
    return DetectionResult.empty();
  }
  
  // Predict from features directly
  static Future<double> predict(List<double> features) async {
    try {
      final result = await _channel.invokeMethod('predict', {
        'features': features,
      });
      
      if (result != null) {
        return (result as num).toDouble();
      }
    } on PlatformException catch (e) {
      print('Failed to predict: ${e.message}');
    } catch (e) {
      print('Error: $e');
    }
    
    return 0.0;
  }
  
  // Get landmarks from image
  static Future<List<List<double>>> getLandmarks(Uint8List imageBytes) async {
    try {
      final result = await _channel.invokeMethod('getLandmarks', {
        'imageBytes': imageBytes,
      });
      
      if (result != null && result is List) {
        return result.map((list) => 
          (list as List).map((e) => (e as num).toDouble()).toList()
        ).toList();
      }
    } on PlatformException catch (e) {
      print('Failed to get landmarks: ${e.message}');
    } catch (e) {
      print('Error: $e');
    }
    
    return [];
  }
}

class DetectionResult {
  final bool isAlif;
  final double confidence;
  final bool hasHand;
  
  DetectionResult({
    required this.isAlif,
    required this.confidence,
    required this.hasHand,
  });
  
  factory DetectionResult.fromMap(Map<dynamic, dynamic> map) {
    return DetectionResult(
      isAlif: map['isAlif'] ?? false,
      confidence: (map['confidence'] ?? 0.0).toDouble(),
      hasHand: map['hasHand'] ?? false,
    );
  }
  
  factory DetectionResult.empty() {
    return DetectionResult(
      isAlif: false,
      confidence: 0.0,
      hasHand: false,
    );
  }
}