plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace 'com.example.signspeak'
    compileSdk 36

    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Prevents compression of model files
    aaptOptions {
        noCompress "tflite"
        noCompress "task"
    }

    defaultConfig {
        applicationId 'com.example.signspeak'
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 1
        versionName '1.0'
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // ============================================
    // CAMERA
    // ============================================
    implementation 'androidx.camera:camera-core:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'

    // ============================================
    // ANDROIDX
    // ============================================
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.multidex:multidex:2.0.1'

    // ============================================
    // FIREBASE (auto-added by Flutter plugin)
    // ============================================
    // No need to add manually — handled by flutter's plugin

    // ============================================
    // ❌ DO NOT ADD (causes conflicts)
    // ============================================
    // implementation 'com.google.mediapipe:mediapipe:...'
    // implementation 'org.tensorflow:tensorflow-lite:...'
    // implementation 'com.google.mlkit:...'
}