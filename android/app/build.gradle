plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace 'com.example.signspeak'
    
    // 🔥 FIX: Use compileSdk 34 instead of 36 for better compatibility
    compileSdk 34

    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'  // 🔥 FIX: Use 1.8 instead of 17 for Java 8 compatibility
    }

    defaultConfig {
        applicationId 'com.example.signspeak'
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName '1.0'
        
        // 🔥 ADD: For better performance
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // ============================================
    // 📱 EXISTING DEPENDENCIES
    // ============================================
    implementation 'androidx.camera:camera-core:1.3.0'
    implementation 'androidx.camera:camera-camera2:1.3.0'
    implementation 'androidx.camera:camera-lifecycle:1.3.0'
    implementation 'androidx.camera:camera-view:1.3.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    
    // ============================================
    // 📱 HAND DETECTION DEPENDENCIES
    // ============================================
    
    // 🔥 OPTION 1: Google ML Kit (Recommended - More Stable)
    implementation 'com.google.mlkit:hand-pose-detection:16.0.0-beta1'
    implementation 'com.google.mlkit:vision-common:17.3.0'
    
    // 🔥 OPTION 2: MediaPipe (Alternative if ML Kit fails)
    // implementation 'com.google.mediapipe:solution-core:latest.release'
    // implementation 'com.google.mediapipe:hands:latest.release'
    
    // TensorFlow Lite
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
    
    // AndroidX Core KTX
    implementation 'androidx.core:core-ktx:1.12.0'
    
    // Guava for ListenableFuture (Required for ML Kit)
    implementation 'com.google.guava:guava:31.1-android'
    
    // 🔥 ADD: MultiDex support
    implementation 'androidx.multidex:multidex:2.0.1'
    
    // 🔥 ADD: Kotlin coroutines for async operations
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}