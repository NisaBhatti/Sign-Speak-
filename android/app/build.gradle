plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace 'com.example.signspeak'
    compileSdk 36

    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId 'com.example.signspeak'
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 1
        versionName '1.0'
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // ============================================
    // 📱 EXISTING DEPENDENCIES
    // ============================================
    implementation 'androidx.camera:camera-core:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    
    // ============================================
    // 📱 MEDIAPIPE FOR HAND DETECTION (USE SPECIFIC VERSION)
    // ============================================
    implementation 'com.google.mediapipe:solution-core:0.10.14'
    implementation 'com.google.mediapipe:hands:0.10.14'
    
    // ============================================
    // 📱 TENSORFLOW LITE - USE SAME VERSION AS MEDIAPIPE
    // ============================================
    implementation 'org.tensorflow:tensorflow-lite:2.13.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
    
    // ============================================
    // 📱 ANDROIDX
    // ============================================
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}

// ============================================
// 🔥 FIX DUPLICATE CLASSES
// ============================================
configurations {
    all {
        exclude group: 'com.google.ai.edge.litert', module: 'litert-api'
        exclude group: 'org.tensorflow', module: 'tensorflow-lite-api'
    }
}