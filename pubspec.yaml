name: signspeak
description: "Urdu Sign Language Detection App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # ===== CAMERA =====
  camera: ^0.10.6

  # ============================================
  # ✅ TENSORFLOW LITE (UPDATED VERSION)
  # ============================================
  tflite_flutter: ^0.11.0
  
  # ============================================
  # ✅ IMAGE PROCESSING (UPDATED VERSION)
  # ============================================
  image: ^4.2.0
  
  # ============================================
  # ✅ HTTP (UPDATED VERSION)
  # ============================================
  http: ^1.3.0
  
  # ===== PERMISSIONS =====
  permission_handler: ^11.3.1
  
  # ===== UI & UTILITIES =====
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.4
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  google_fonts: ^6.3.3

  # ===== VIDEO OPENING =====
  url_launcher: ^6.3.0
  
  # ===== STATE MANAGEMENT =====
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  
  # ===== NAVIGATION =====
  go_router: ^14.8.1
  
  # ===== FIREBASE =====
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  google_sign_in: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1   # 👈 SIRF YEH ADD HUA HAI

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/models/alif_robust.tflite
    - assets/models/hand_landmarker.tflite  
    - assets/models/hand_detection.tflite

# 👇 SIRF YEH SECTION ADD HUA HAI (App Icon Change Karne Ke Liye)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#FFFFFF"
    theme_color: "#080454"