name: signspeak
description: "Urdu Sign Language Detection App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Core
  cupertino_icons: ^1.0.9
  google_fonts: ^6.3.3
  provider: ^6.1.5+1
  go_router: ^14.8.1
  
  # Camera
  camera: ^0.10.5
  image: ^4.0.17
  image_picker: ^0.8.7+5
  permission_handler: ^10.4.3
  path_provider: ^2.1.5
  
  # ML & AI - Use Google ML Kit instead
  tflite_flutter: ^0.11.0
  google_ml_kit: ^0.16.0  
  webview_flutter: ^4.4.0
  
  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  google_sign_in: ^6.3.0
  
  # Utilities
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.5
  ffi: ^2.2.0
  mediapipe: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/models/
    - assets/images/