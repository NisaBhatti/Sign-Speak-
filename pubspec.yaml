name: signspeak
description: "Urdu Sign Language Detection App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ===== FIREBASE =====
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  firebase_core_platform_interface: ^6.0.3
  
  # ===== GOOGLE ML KIT (Full Suite) =====
  google_ml_kit: ^0.16.3
  google_mlkit_barcode_scanning: ^0.10.0
  google_mlkit_commons: ^0.6.1
  google_mlkit_digital_ink_recognition: ^0.10.0
  google_mlkit_entity_extraction: ^0.11.0
  google_mlkit_face_detection: ^0.9.0
  google_mlkit_face_mesh_detection: ^0.0.2
  google_mlkit_image_labeling: ^0.10.0
  google_mlkit_language_id: ^0.9.0
  google_mlkit_object_detection: ^0.11.0
  google_mlkit_pose_detection: ^0.10.0
  google_mlkit_selfie_segmentation: ^0.6.0
  google_mlkit_smart_reply: ^0.9.0
  google_mlkit_text_recognition: ^0.11.0
  google_mlkit_translation: ^0.9.0
  
  # ===== MEDIAPIPE =====
  mediapipe: ^0.0.1
  
  # ===== TENSORFLOW LITE =====
  tflite_flutter: ^0.11.0
  
  # ===== GOOGLE SIGN IN =====
  google_sign_in: ^6.3.0
  google_sign_in_android: ^6.2.1
  google_sign_in_ios: ^5.9.0
  google_sign_in_web: ^0.12.4+4
  
  # ===== CAMERA =====
  camera: ^0.10.6
  
  # ===== UI & UTILITIES =====
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.4
  cached_network_image: ^3.4.1
  cached_network_image_platform_interface: ^4.1.1
  cached_network_image_web: ^1.3.1
  flutter_svg: ^2.3.0
  google_fonts: ^6.3.3
  flutter_cache_manager: ^3.4.2
  octo_image: ^2.1.0
  vector_graphics: ^1.2.3
  
  # ===== STATE MANAGEMENT =====
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  
  # ===== NAVIGATION =====
  go_router: ^14.8.1
  
  # ===== PERMISSIONS =====
  permission_handler: ^11.3.1
  
  # ===== IMAGE PROCESSING =====
  image: ^4.1.3
  path_parsing: ^1.1.0
  
  # ===== DATABASE =====
  sqflite: ^2.4.2+1
  sqflite_android: ^2.4.2+3
  sqflite_common: ^2.5.8
  sqflite_darwin: ^2.4.2
  sqflite_platform_interface: ^2.4.0
  synchronized: ^3.4.0+1
  
  # ===== JNI UTILITIES =====
  jni: ^1.0.3
  jni_flutter: ^1.0.2
  jni_util: ^1.0.0
  
  # ===== OTHER UTILITIES =====
  path_provider: ^2.1.6
  path_provider_android: ^2.3.1
  path_provider_foundation: ^2.6.0
  args: ^2.7.0
  crypto: ^3.0.7
  fixnum: ^1.1.1
  logging: ^1.3.0
  objective_c: ^9.5.0
  package_config: ^3.0.0
  pub_semver: ^2.2.0
  quiver: ^3.2.2
  rxdart: ^0.28.0
  uuid: ^4.6.0
  code_assets: ^1.2.1
  hooks: ^2.0.2
  record_use: ^0.6.0
  vector_graphics_codec: ^1.1.13
  vector_graphics_compiler: ^1.3.0
  google_identity_services_web: ^0.3.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/models/alif_robust.tflite
    - assets/models/hand_landmark.task  # MediaPipe model