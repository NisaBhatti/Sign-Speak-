name: signspeak
description: A sign language app for deaf community
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  google_sign_in: ^6.3.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10

  # Storage
  shared_preferences: ^2.5.0

  # UI
  cupertino_icons: ^1.0.9
  google_fonts: ^6.3.3
  flutter_svg: ^2.3.0

  # Camera
  camera: ^0.10.6
  image_picker: ^0.8.9
  permission_handler: ^13.0.0

  # Navigation
  provider: ^6.1.5+1
  go_router: ^14.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/