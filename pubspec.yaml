name: signspeak
description: "Urdu Sign Language Detection App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ===== GOOGLE ML KIT (Use the full package) =====
  google_ml_kit: ^0.16.3
  
  # ===== CAMERA =====
  camera: ^0.10.6
  
  # ===== PERMISSIONS =====
  permission_handler: ^11.3.1
  
  # ===== UI & UTILITIES =====
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.4
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  google_fonts: ^6.3.3
  
  # ===== STATE MANAGEMENT =====
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  
  # ===== NAVIGATION =====
  go_router: ^14.8.1
  
  # ===== FIREBASE =====
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  google_sign_in: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/