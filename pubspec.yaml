name: signspeak
description: "Urdu Sign Language Detection App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ===== GOOGLE ML KIT COMPONENTS =====
  google_mlkit_hand_detection: ^0.12.1  # For hand detection
  google_mlkit_pose_detection: ^0.13.1  # For pose detection
  google_mlkit_commons: ^0.6.1          # Common utilities
  google_mlkit_image_labeling: ^0.13.1  # For image labeling
  
  # ===== TFLITE FOR CUSTOM MODELS =====
  tflite_flutter: ^0.11.0
  
  # ===== CAMERA =====
  camera: ^0.10.6
  
  # ===== UI & UTILITIES =====
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.4
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.1.0
  
  # ===== STATE MANAGEMENT =====
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  
  # ===== NAVIGATION =====
  go_router: ^14.2.8
  
  # ===== PERMISSIONS =====
  permission_handler: ^11.3.1
  
  # ===== FIREBASE =====
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.3
  google_sign_in: ^6.2.2
  
  # ===== IMAGE PROCESSING =====
  image: ^4.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/models/alif_robust.tflite