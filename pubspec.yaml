name: signspeak
description: "Urdu Sign Language Detection App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.10+1
  
  # Camera & Image Processing
  camera: ^0.10.5
  image_picker: ^1.1.4
  image: ^4.1.3
  cached_network_image: ^3.4.1
  
  # Google ML Kit (Includes MediaPipe)
  google_ml_kit: ^0.16.0
  
  # TensorFlow Lite
  tflite_flutter: ^0.11.0
  
  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.3
  
  # Google Sign In
  google_sign_in: ^6.2.2
  
  # State Management
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  
  # Navigation
  go_router: ^14.2.8
  
  # Permissions
  permission_handler: ^11.3.1
  
  # File & System
  path_provider: ^2.1.0
  ffi: ^2.1.0
  
  # For better performance
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    # Images
    - assets/images/
    
    # Models - place your trained TFLite models here
    - assets/models/alif_robust.tflite
    - assets/models/alif_model.tflite
    - assets/models/hand_landmark.tflite  # If using MediaPipe model
    
    # Fonts (if any)
    # - assets/fonts/
  
  # Optional: Fonts
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/custom_font.ttf

# Flutter Launcher Icons Configuration (Optional)
flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#0A0454"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"

# Flutter Native Splash Configuration (Optional)
flutter_native_splash:
  color: "#0A0454"
  image: assets/images/splash.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center